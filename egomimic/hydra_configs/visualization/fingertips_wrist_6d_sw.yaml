# Visualization for STEP-WISE 6D palm + per-timestep fingertip actions (mecka, v2).
# The revert chain-composes the frame-to-frame palm deltas from the head-frame wrist
# anchor (P_t = anchor ∘ A_0 ∘ … ∘ A_t), then re-anchors each timestep's fingertips by
# that timestep's recovered wrist pose. Output layout matches fingertips_wrist_6d, so
# Mecka.viz(mode="fingertips") renders palm (normal dot) + 5 fingertips (small dots).
eva_bimanual:
  _target_: egomimic.rldb.embodiment.eva.Eva.viz_gt_preds
  _partial_: true
  image_key: front_img_1
  action_key: actions_cartesian
  mode: traj
aria_bimanual:
  _target_: egomimic.rldb.embodiment.human.Aria.viz_gt_preds
  _partial_: true
  image_key: front_img_1
  action_key: actions_cartesian
  mode: traj
mecka_bimanual:
  _target_: egomimic.rldb.embodiment.human.Mecka.viz_gt_preds
  _partial_: true
  image_key: front_img_1
  action_key: actions_cartesian
  mode: fingertips
  transform_list:
    _target_: egomimic.rldb.embodiment.human._build_mecka_revert_wf6d_ft_stepwise_transform_list
    # process_batch_for_training maps observations.state.ee_pose -> keyname "ee_pose"
    obs_key: "ee_pose"
scale_bimanual:
  _target_: egomimic.rldb.embodiment.human.Scale.viz_gt_preds
  _partial_: true
  image_key: front_img_1
  action_key: actions_cartesian
  mode: traj
