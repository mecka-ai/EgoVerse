defaults:
  - model: hpt_bc_flow_eva
  - visualization: cartesian
  - paths: default
  - trainer: ddp
  - debug: null
  - logger: wandb
  - data: mecka_all_zarr
  - callbacks: checkpoints
  - data_schematic: default
  - evaluator: eval_hpt
  # Optional second evaluator for the train_viz val pass (dataloader_idx=1).
  # Defaults to null (disabled). Enable via CLI:
  #   evaluator@train_viz_evaluator=train_viz_hpt
  # which loads hydra_configs/evaluator/train_viz_hpt.yaml into
  # cfg.train_viz_evaluator. Pair with a data config that defines
  # `train_viz_datasets`.
  - evaluator@train_viz_evaluator: train_viz_hpt
  - override hydra/launcher: submitit
  - _self_

name: test
description: test
ckpt_path: null
wandb_run_id: null  # set to resume an existing W&B run (auto-set on Modal auto-restart)
mode: train

hydra:
  run:
    # Dir should be experiment_name/description_{timestamp}
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

launch_params:
  gpus_per_node: 1
  nodes: 1

seed: 42

# Normalization and norm-stat cache settings (override per-run as needed).
norm_stats:
  sample_frac: 0.02
  num_workers: 30
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
reject_outliers: true
# Absolute tolerance added to each side of the quantile bounds before rejecting a frame.
# 0.01 suppresses spurious angle wrap-around violations near ±π without letting
# through genuinely bad frames (which are typically 0.05–0.15 outside bounds).
reject_outliers_slack: 0.02
