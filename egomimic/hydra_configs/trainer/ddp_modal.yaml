defaults:
  - default

# Modal is always single-node; set num_nodes: 1.
# Set launch_params.gpus_per_node on the CLI to match the GPU count
# requested in modal_setup.py CFG.gpu (e.g. "A100:4" → gpus_per_node=4).
# pi0.5 masks the synthesized wrist camera slots, so those params receive no
# gradient and DDP's reducer aborts unless unused params are tolerated.
strategy: ddp_find_unused_parameters_true

accelerator: gpu
devices: ${launch_params.gpus_per_node}
num_nodes: 1
sync_batchnorm: True
# 25, not 200: at ~4 min/epoch, 200 meant the first validation point landed
# ~13h in -- and when it crashed there, it took the first checkpoint with it.
# 25 gives a usable curve (~100 min per point) and fails fast if val breaks.
check_val_every_n_epoch: 25
num_sanity_val_steps: 0

# Sentinel: trainHydra.py detects this and auto-submits to Modal instead of
# running locally. Do NOT set this in any other trainer config.
_modal: true
