# ASSEMBLING_BLOOKETS (booklet assembly) — NOZIP (ModalEpisodeResolver, reads
# /mnt/zarr-data directly; no zip/tar staging).
#
# Hand-picked test subset of 35 episodes of the booklet-assembly task
# (collating/stacking paper sheets, folding brochures, spiral binding).
#   task: assembling booklets   subset = 35 eps, 89,959 frames
#         = 2,999 s ≈ 50 min ≈ 0.83 h @ 30 fps (mean ~85.7 s/ep)
#
# Disjoint train/val baked into separate allowlists (mode: total — no resolver
# split). The split reproduces the documented seed-14 split from
# assembling_blookets_test.yaml:
#   val (3):  69b26795… (old train_viz), 69b520b3…, 69cea6b6…
#   train (32): the remaining episodes (assembling_blookets_train.json)
#   viz (1):  69b493d8… (assembling_blookets_test_viz.json)
#
# Launch (mirror assembling_blookets_test.yaml; swap +modal_volume to the
# unzipped zarr volume and data=assembling_blookets_nozip).

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: random
annotation_key: annotations
default_prompt: ""

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/assembling_blookets_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/assembling_blookets_val.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/assembling_blookets_test_viz.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 128
    num_workers: 12
    persistent_workers: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 4
    persistent_workers: true

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
