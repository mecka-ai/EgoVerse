# MECKA_RANDOM_200H — random 200h-train sample of mecka_data_v2 (pi0.5 variant).
#
# A random ~250h pool of mecka_bimanual episodes (all tasks) present on the
# mecka_data_v2 volume (allowlist extra/mecka_random_250h.json, 10087 eps), fed to
# the DEFAULT MultiDataset split (valid_ratio 0.2, seed 42, by episode):
#   TRAIN 8070 eps ≈ 200.1h   |   VALID 2017 eps ≈ 49.9h
# LocalEpisodeResolver scans folder_path and reads per-episode metadata from the
# zarr attrs — NO database. The folder already contains exactly the 10087
# allowlist episodes, so scanning it == the allowlist (hence no eps_to_use here).
# (Was ModalEpisodeResolver+SQL; switched to local since this is not a Modal run.)
#
# Allowlist regenerated by extra/gen_random_250h.py (SQL ∩ volume, seed-7 random
# selection to a 250h budget at 30 fps). NOTE: keymap requests annotations
# (pi0.5 language conditioning) — episodes without annotations would fall back to
# default_prompt; set annotations: false below for a non-language run.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: random
annotation_key: annotations
default_prompt: ""

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /workspace/mecka_random_250h_zarr
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /workspace/mecka_random_250h_zarr
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid

# Small viz set (8 episodes from the pool) for evaluator@train_viz_evaluator=train_viz_pi
# (dataloader_idx=1). Omit the train_viz evaluator at launch if you don't want it.
train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /workspace/mecka_random_250h_zarr
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      debug: 8
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64        # per-device; 4×H200 → global batch 256
    num_workers: 32
    persistent_workers: true
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    shuffle: false

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
    shuffle: false
