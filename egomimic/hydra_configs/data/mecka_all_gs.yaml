# Training: globally-shuffled shards (MP4+npz, pre-transformed).
# No validation dataset — all data comes from the GS volume only.
#
# Build shards first:
#   modal run --env robotics egomimic/modal/build_global_shuffle_shards.py
#
# Then train:
#   python egomimic/modal/trainModal.py name=<run> description=<desc> data=mecka_all_gs model=deminf_default trainer=ddp_modal init_submodules=false +modal_gpu=H200

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.gs_shard_dataset.GlobalShuffleShardDataset
    shard_dir: /mnt/zarr-gs/global_shuffle_debug300
    image_size: [224, 224]
    action_key: actions_cartesian
    image_key: observations.images.front_img_1
    prefetch_shards: 2

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /mnt/zarr-data
      debug: 5
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 6

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 2
