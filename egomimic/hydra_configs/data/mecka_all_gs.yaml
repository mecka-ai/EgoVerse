# Training: globally-shuffled shards (MP4+npz, pre-transformed).
# No validation dataset — all data comes from the GS volume only.
#
# Build shards first:
#   modal run --env robotics egomimic/modal/build_global_shuffle_shards.py
#
# Then train:
#   python egomimic/modal/trainModal.py name=<run> description=<desc> data=mecka_all_gs model=deminf_default trainer=ddp_modal init_submodules=false +modal_gpu=H200

norm_stats:
  precomputed_norm_path: precomputed_norm_stats/mecka_all_zarr

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.gs_shard_dataset.GlobalShuffleShardDataset
    shard_dir: /mnt/zarr-gs/global_shuffle_debug300
    image_size: [224, 224]
    action_key: actions_cartesian
    image_key: observations.images.front_img_1
    prefetch_shards: 2

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 6
