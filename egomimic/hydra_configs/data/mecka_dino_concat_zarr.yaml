_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# dinov3_k10-20_lang_concat — TOP-60% — zarr volume (ModalEpisodeResolver)
#
# SHARED ACROSS ALL 4 LANG-CURATION ARMS:
#   valid     → mecka_lang4runs_val_3ep.json   (3 eps: assembling_booklets, washing_bowls, folding_socks)
#   train_viz → mecka_lang4runs_train_viz.json (same 3 eps, identical to val_3ep)
#
# ARM-SPECIFIC:
#   train = 237 eps (mecka_dino_concat_top60_train.json)
#
# Invariants: val ∩ train = ∅  |  train_viz = val_3ep  |  no cross-arm contamination

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_dino_concat_top60_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_lang4runs_val_3ep.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_lang4runs_train_viz.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 4

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
