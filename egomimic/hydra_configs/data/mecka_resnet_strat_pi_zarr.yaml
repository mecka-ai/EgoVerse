_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# resnet_k10-20_lang_stratified — TOP-60% — zarr (Pi, language-conditioned)
# Source: resnet_k10-20_lang_stratified/14-task resnet language stratified_2026-06-11_22-13-50
#
# Same train/val/train_viz as mecka_resnet_strat_zarr but with annotations: true
# to enable language instruction conditioning for the Pi model.
#
# SHARED:
#   valid     → mecka_lang4runs_v2_val.json      (3 eps: assembling_booklets, washing_bowls, folding_socks)
#   train_viz → mecka_lang4runs_v2_train_viz.json (3 in-domain eps, same tasks)
#
# ARM-SPECIFIC:
#   train = 237 eps (mecka_resnet_strat_v2_train.json)
#
# Invariants: val ∩ train = ∅  |  train_viz ⊆ train  |  no cross-arm contamination

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
        pi_mode: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_resnet_strat_v2_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
        pi_mode: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_lang4runs_v2_val.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
        pi_mode: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_lang4runs_v2_train_viz.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 4

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
