# FOLD_CLOTHES_ALL — HPT (regular, non-pi) variant.
#
# Mirrors fold_clothes.yaml (MultiDataset._from_resolver + LocalEpisodeResolver,
# Mecka cartesian keymap/transforms, no pi0.5 tokenizer wiring) but points at the
# full fold-clothes JSON allowlist (extra/fold_clothes_all.json — 461 accepted
# episode hashes; the complete set rather than the curated ~178 subset).
#
# Launch (4xH200, HPT, 32 workers, bs128):
#   NUM_WORKERS=32 BATCH_SIZE=128 GPUS=4 DATA=fold_clothes_all NAME=fold_clothes_all_hpt \
#     DESC=hpt_foldclothes_all_bs128_32w_4gpu ./run_hpt.sh

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /workspace/fold_clothes_zarr
      allowed_episode_ids:
        _target_: json.load
        fp:
          _target_: builtins.open
          file: ${hydra:runtime.cwd}/egomimic/hydra_configs/data/extra/fold_clothes_all.json
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /workspace/fold_clothes_zarr
      allowed_episode_ids:
        _target_: json.load
        fp:
          _target_: builtins.open
          file: ${hydra:runtime.cwd}/egomimic/hydra_configs/data/extra/fold_clothes_all.json
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 48
    persistent_workers: true
    prefetch_factor: 8
    pin_memory: true
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 8
    persistent_workers: false
    prefetch_factor: 2
    pin_memory: true
    shuffle: false
