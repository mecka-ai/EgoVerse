# WAM data: a frame CLIP + frame-aligned action/state ee-pose chunks loaded via
# ZarrWamDataset (windowed camera read -> clip) through ModalWamEpisodeResolver
# (SQL filter + /mnt/zarr-data Modal volume) with the Mecka WAM keymap/transform.
# WamMultiDataset skips quantile bounds rejection (raw frame-aligned ee-poses,
# no quantile calibration). Pair with model=wam_bc_human_wan22_5b.
#
# Alignment (Wan VAE 4x temporal): cam_horizon=17 -> 5 latent frames (1 cond +
# 4 predicted); action_horizon=16 (4x4); state_horizon=4 (1 per predicted frame).
#
# The filter pins to a known-good set of mecka episode hashes (the mecka_all_zarr
# smoke set) so a first/debug run is deterministic. mode: total (the 80/20 hash
# split would empty the bucket with so few episodes). Widen the filter for a real
# training run.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_wam.WamMultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_wam.ModalWamEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_wam_keymap
        cam_horizon: 17
        action_horizon: 16
        state_horizon: 4
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_wam_transform_list
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['episode_hash'] in {'69b1d00f29d110add752dd69','69d4aa8f782738835770d90b','69d2ed564893f9e0d63a7b26','69b26a38c0e914cdcebdcdcd','69b20b7a420b58a5f78421a1','69cf789d58d2d7dee29aade9','69bb706d0de22d3b2bfa3f48','69b38e7b76a7fcd9155cb4ec','69b1f24c7a2805ad3332bf52','69cdce8f4d0eb7a1e7993837','69d34b2ff3b3fcc3d93facca','69b1ce6f4143ec12d1347ef0','69b1ce25602aeffae3c00dff','69b21291a38e9e0d25df4574'}"
    mode: total

valid_datasets:
  mecka_bimanual: ${data.train_datasets.mecka_bimanual}

train_dataloader_params:
  mecka_bimanual:
    batch_size: 2
    num_workers: 10

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 2
    num_workers: 10
