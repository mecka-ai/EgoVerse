# Data config for OAT tokenizer training over the full WDS (tar-shard) dataset.
# Mirrors mecka_all_wds but uses larger batches — the OAT tokenizer has no image
# encoder so forward passes are cheap, even though images are still delivered
# by the WDS shards.
#
# Launch command:
#   python egomimic/modal/trainModal.py \
#       model=oat_tokenizer \
#       data=mecka_all_wds_oat_tok \
#       evaluator=null \
#       trainer=ddp_modal \
#       +modal_volume=mecka_data_wds_v2 \
#       name=oat_tok description=mecka_bimanual_wds
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.tar_shard_dataset.TarShardIterableDataset
    shard_dir: /mnt/zarr-wds
    mode: train
    cache_dir: /tmp/shard_cache
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian
    # Plain config block (no _target_) that trainHydra.py uses to build the norm_stats
    # dataset via resolver.key_map. norm_mode=True is injected at runtime. Not instantiated.
    resolver:
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.tar_shard_dataset.TarShardIterableDataset
    shard_dir: /mnt/zarr-wds
    mode: valid
    cache_dir: /tmp/shard_cache
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian
    resolver:
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian

train_dataloader_params:
  mecka_bimanual:
    # Larger batch than HPT configs — no image encoder, so GPU forward pass is cheap
    # even though WDS shards still deliver image tensors.
    batch_size: 256
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
    # shuffle must be False — TarShardIterableDataset shuffles shards/episodes/frames internally
    shuffle: false

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 128
    num_workers: 2
    persistent_workers: true
    prefetch_factor: 1
