_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# 50k train + 20k eval mecka_bimanual episodes, non-overlapping.
#
# Both resolvers select the same 70k episodes from the SQL pool via
# max_episodes=70000 with a deterministic hash-sorted truncation, then
# MultiDataset.split_dataset_names (seed=42) partitions them:
#   n_valid = int(70000 * 0.285715) = 20000  →  train = 50000

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      pause_removal_epsilon: 0.005
      max_episodes: 70000
      eps_to_ignore: egomimic/hydra_configs/data/extra/failures.json
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    valid_ratio: 0.285715

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      pause_removal_epsilon: 0.005
      max_episodes: 70000
      eps_to_ignore: egomimic/hydra_configs/data/extra/failures.json
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    valid_ratio: 0.285715

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 10

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 10
