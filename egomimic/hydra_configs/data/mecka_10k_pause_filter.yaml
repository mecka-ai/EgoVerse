_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.tar_shard_dataset.TarShardIterableDataset
    shard_dir: /mnt/zarr-wds
    mode: train
    cache_dir: /tmp/shard_cache
    debug: 500 
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian
    # Plain config block (no _target_) that trainHydra.py uses to build the norm_stats
    # dataset via resolver.key_map. norm_mode=True is injected at runtime. Not instantiated.
    resolver:
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
    mode: train

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.tar_shard_dataset.TarShardIterableDataset
    shard_dir: /mnt/zarr-wds
    mode: valid
    cache_dir: /tmp/shard_cache
    debug: 500  
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian
    resolver:
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
    mode: valid
train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 10
    persistent_workers: true
    prefetch_factor: 2
    # shuffle must be False — TarShardIterableDataset shuffles shards/episodes/frames internally
    shuffle: false

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 10
    persistent_workers: true
    prefetch_factor: 1
