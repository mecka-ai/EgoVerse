_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Data-diversity human-only pretrain — set D1, OPERATOR-HOLDOUT validation variant.
# Identical to data_diversity_D1_val5_zarr.yaml EXCEPT the train/val split:
#   - One operator per task (5 tasks) is held out ENTIRELY from train (fully unseen).
#   - val = 4 episodes per task from that task's held-out operator (20 eps total).
#   - train = D1 minus the 20 held-out-operator episodes (9366 eps).
# Legacy-SQL (69...) episode ids -> ModalEpisodeResolver on /mnt/zarr-data.
#   train -> data_diversity/D1_ophold_train.json   valid -> data_diversity/val_operator_heldout.json

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
        pad_gripper: true
      eps_to_use: egomimic/hydra_configs/data/extra/data_diversity/D1_ophold_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
        pad_gripper: true
      eps_to_use: egomimic/hydra_configs/data/extra/data_diversity/val_operator_heldout.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true
