# 4×H200 — 3-TASK / ~10h, task-mix sweep point "60_30_10".
#
# Tasks: folding_boxes, folding_clothes, making_flowers (high inter-task
# variance). Total data fixed at ~10h; this point splits it
# folding_boxes 30%, folding_clothes 60%, making_flowers 10%.
# Generated by egomimic/scripts/mecka_process/build_3task_10h_configs.py (seed 42).
#
# Per-task episodes (≈hours):
#     folding_boxes     124 eps  (~3.00h)
#     folding_clothes   235 eps  (~6.00h)
#     making_flowers     42 eps  (~1.01h)
#   TRAIN total: 401 eps (~10.01h)
#
# Shared held-out eval set (same across all three mix configs): 90
# episodes, 30/task, disjoint from every train set
# (mecka_3task_eval.json). train_viz: one episode per task (3 total).

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: random
annotation_key: annotations
default_prompt: ""

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_3task_10h_60_30_10.json
      valid_ratio: 0.0          # dedicated train list — eval is a separate held-out set
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    episodes_per_epoch: 401     # == full train subset → stage-all before training
    epoch_frames: ${multiply:${trainer.limit_train_batches},${data.train_dataloader_params.mecka_bimanual.batch_size}}
    cache_dir: /cache/zarr_cache
    pool_size_gb: 100
    lookahead_epochs: 2.0
    n_copy_threads: 48
    prepare_timeout_s: 3600

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_3task_eval.json
      valid_ratio: 1.0          # shared held-out eval — use ALL episodes
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 90      # full shared eval set (30/task)
    max_frames_per_episode: 24  # 90×24=2160 frames → all 90 eps covered (33/33/33 by frame)
    cache_dir: /cache/zarr_cache_valid
    pool_size_gb: 25
    lookahead_epochs: 2.0
    n_copy_threads: 16
    prepare_timeout_s: 3600

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_3task_viz.json
      valid_ratio: 1.0          # keep all viz episodes (no split)
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 3       # == n_tasks
    epoch_frames: 240           # 3 tasks × max_frames_per_episode=80
    max_frames_per_episode: 80
    cache_dir: /cache/zarr_cache_viz
    pool_size_gb: 5
    lookahead_epochs: 1.0
    n_copy_threads: 4
    prepare_timeout_s: 3600

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64            # per-device; 4×H200 → 256 global batch
    num_workers: 16
    persistent_workers: false
    prefetch_factor: 6
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 4
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 1
    persistent_workers: false
    prefetch_factor: 2
    shuffle: false
