_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# DEMINF-64 — RANDOM-60% arm — zarr (Pi, language-conditioned)
#
# Same rand60 train episodes as mecka_d64_rand60_zarr_viz but with annotations: true
# to enable language instruction conditioning for the Pi model.
# Val and train_viz are rand60-specific (separate from lang runs — all 24 washing_bowls
# episodes are covered by the union of 5 trains so a shared val is impossible).
#
# val     → mecka_rand60_pi_val.json      (3 eps: assembling_booklets, washing_bowls, folding_socks; not in rand60 train)
# train_viz → mecka_rand60_pi_train_viz.json (3 in-domain eps, same tasks; in rand60 train)
#
# Invariants: val ∩ train = ∅  |  train_viz ⊆ train

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
        pi_mode: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_d64_rand60_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
        pi_mode: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_rand60_pi_val.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
        pi_mode: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_rand60_pi_train_viz.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 4
    persistent_workers: true

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
