_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# folding_clothes BOTTOM 40% (operator 6943a1d1a2a8b5aee76607f1 held out), val=operator
# train     -> folding_clothes_op_bot40_train.json
# valid     -> folding_clothes_op_val.json
# train_viz -> folding_clothes_op_bot40_viz.json
# val n train = empty; train_viz subset of train.

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/folding_clothes_op_bot40_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/folding_clothes_op_val.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/folding_clothes_op_bot40_viz.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 8

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 8

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
