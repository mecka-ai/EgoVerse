_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# DEMINF-64 COMPARISON — TOP-60% arm.
# Trains on the top 60% of DemInf-scored episodes per task (ceil(0.6·n) by MI,
# 237 episodes), which is disjoint from the bottom-40% validation set by
# construction.
# Source scores: deminf_tsne/14task_dim64_k10_20_viz3d_2026-06-09_19-49-48 (64-dim

#   train = top60 237 episodes  |  valid = 14 (mecka_d64_val.json)
# mode: total — episode lists are used verbatim (no internal random split), so
# validation parity across arms is guaranteed by construction. Run with
# trainer.limit_val_batches=1.0 so every frame of all 14 val episodes is
# validated each cycle.

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_d64_top60_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_d64_val.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
