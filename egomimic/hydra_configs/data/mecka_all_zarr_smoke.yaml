# Smoke config for the train_viz refactor.
#
# `train_viz_datasets` below pins to 2 episode hashes (extra filter lambda)
# and uses `mode: total` so the resolved set is used as-is (the 80/20 hash
# split in `mode: train` empties the bucket with so few episodes).
#
# To exercise the second val loader, also enable the train_viz evaluator.
# The slot is declared in train_zarr_cartesian.yaml as
#   - evaluator@train_viz_evaluator: null
# so the CLI override uses the group@package form (loads from
# hydra_configs/evaluator/<name>.yaml into cfg.train_viz_evaluator):
#   python egomimic/modal/trainModal.py \
#     data=mecka_all_zarr_smoke trainer=debug_modal logger=wandb \
#     model=hpt_bc_flow_mecka name=train_viz_smoke description=smoke \
#     evaluator@train_viz_evaluator=train_viz_hpt
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['episode_hash'] in {'69b1d00f29d110add752dd69','69d4aa8f782738835770d90b','69d2ed564893f9e0d63a7b26','69b26a38c0e914cdcebdcdcd','69b20b7a420b58a5f78421a1','69cf789d58d2d7dee29aade9','69bb706d0de22d3b2bfa3f48','69b38e7b76a7fcd9155cb4ec','69b1f24c7a2805ad3332bf52','69cdce8f4d0eb7a1e7993837','69d34b2ff3b3fcc3d93facca','69b1ce6f4143ec12d1347ef0','69b1ce25602aeffae3c00dff','69b21291a38e9e0d25df4574'}"
    mode: train

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['episode_hash'] in {'69b1d00f29d110add752dd69','69d4aa8f782738835770d90b','69d2ed564893f9e0d63a7b26','69b26a38c0e914cdcebdcdcd','69b20b7a420b58a5f78421a1','69cf789d58d2d7dee29aade9','69bb706d0de22d3b2bfa3f48','69b38e7b76a7fcd9155cb4ec','69b1f24c7a2805ad3332bf52','69cdce8f4d0eb7a1e7993837','69d34b2ff3b3fcc3d93facca','69b1ce6f4143ec12d1347ef0','69b1ce25602aeffae3c00dff','69b21291a38e9e0d25df4574'}"
    mode: valid

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        # Same filter as train above; add extra lambdas here to subsample
        # further (e.g. pin to a small, fixed set of episode hashes).
        - "lambda row: row['episode_hash'] in {'69b1d00f29d110add752dd69','69d4aa8f782738835770d90b','69d2ed564893f9e0d63a7b26','69b26a38c0e914cdcebdcdcd','69b20b7a420b58a5f78421a1','69cf789d58d2d7dee29aade9','69bb706d0de22d3b2bfa3f48','69b38e7b76a7fcd9155cb4ec','69b1f24c7a2805ad3332bf52','69cdce8f4d0eb7a1e7993837','69d34b2ff3b3fcc3d93facca','69b1ce6f4143ec12d1347ef0','69b1ce25602aeffae3c00dff','69b21291a38e9e0d25df4574'}"
        - "lambda row: row['episode_hash'] in {'69b1d00f29d110add752dd69','69b1ce6f4143ec12d1347ef0'}"
    # mode: total — the filter already pins to the exact viz set; skip the
    # 80/20 hash split (which would empty the train bucket with so few eps).
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 4

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 4

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 2
