# Megatron-Energon loader — the SAME per-sample tar shards (<key>.jpg + <key>.npy) as
# data=mecka_all_sb, streamed by Energon's SavableDataLoader (byte-range reads, reservoir shuffle,
# cross-shard interleave, rank×worker sharding, exact deterministic resume; NVIDIA-maintained).
#
# Shards live in the mecka-energon Modal volume, mounted at /mnt/shards in every training container.
#
# One-time prep per shard collection (writes a .nv-meta sidecar beside the tars):
#   modal run egomimic/modal/build_sb_shards.py::main --do prepare --cid <cid>
#
# Launch (norm stats are precomputed → norm pass is skipped):
#   python egomimic/trainHydra.py model=hpt_bc_flow_mecka data=mecka_all_energon trainer=ddp_modal \
#     norm_stats.precomputed_norm_path=precomputed_norm_stats/mecka_all_zarr \
#     init_submodules=false \
#     data.train_datasets.mecka_bimanual.shard_dir=/mnt/shards/materialized/<cid> \
#     data.valid_datasets.mecka_bimanual.shard_dir=/mnt/shards/materialized/<cid>
#
# Energon shards across world_size × num_workers consumers; requires #shards ≥ that product.

_target_: egomimic.pl_utils.pl_data_utils.EnergonMultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.energon.mecka_energon.EnergonShardDataset
    shard_dir: /mnt/shards/materialized/FILL_IN_CID
    split_part: train
    # Reservoir size in samples, held PER worker as DECODED samples. Container RAM ≈
    #   shuffle_buffer_size × decoded_sample_bytes (~2.7 MB f32 image) × (world_size × num_workers).
    # e.g. 4000 × 2.7 MB × (8 GPUs × 8 workers) ≈ 690 GB. Keep this modest on multi-GPU — the
    # cross-shard interleave does most of the mixing, so a 2–4k buffer mixes ~as well as 10k
    # (see mixing table in the PR). 10k × H100:8 would need ~1.7 TB and OOM the box.
    shuffle_buffer_size: 4000
    embodiment_name: mecka_bimanual
    # --- shuffle / interleave knobs ---------------------------------------------------------------
    # These three (not the buffer alone) drive per-batch episode diversity. With them OFF
    # (max_samples_per_sequence=null) a worker drains an entire shard contiguously, so multi-episode
    # shards (e.g. 1 GiB) emit long same-episode runs → poor mixing unless the buffer is huge. With
    # them ON, mixing is shard-size-independent: 1 GiB shards mix as well as episode==shard shards at
    # a small 4k buffer (see mixing_knobs_on_vs_off.png / mixing table). Trade-off: a finite
    # max_samples_per_sequence makes workers switch shards more often (more, smaller reads) — confirm
    # throughput on your storage before lowering it further.
    max_samples_per_sequence: 64    # consecutive samples per shard before switching (null = whole shard)
    parallel_shard_iters: 64        # shards open per worker, shuffled between (null = Energon default 16)
    shuffle_over_epochs_multiplier: 2  # shuffle shard-slice order over N epochs (>=1)
    seed: ${seed}                   # matches global seed → deterministic WorkerConfig per run

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.energon.mecka_energon.EnergonShardDataset
    shard_dir: /mnt/shards/materialized/FILL_IN_CID
    split_part: train              # prepared with split-ratio 1.0,0,0; val unused (limit_val_batches=0)
    shuffle_buffer_size: 4000
    embodiment_name: mecka_bimanual
    max_samples_per_sequence: 64
    parallel_shard_iters: 64
    shuffle_over_epochs_multiplier: 2
    seed: ${seed}

train_dataloader_params:
  mecka_bimanual:
    batch_size: 128
    num_workers: 8                  # Energon worker processes (via WorkerConfig)

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 128
    num_workers: 4
