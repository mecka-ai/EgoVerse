# mecka_all_zarr with debug: 1000 on the ModalEpisodeResolver (first 1000 SQL episodes).
# Use for global-shuffle builds:
#   modal run --env robotics egomimic/modal/build_global_shuffle_shards.py \
#     --data-config mecka_all_zarr_debug1000 \
#     --coverage-multiplier 1.5 \
#     --frames-per-shard 10000 \
#     --output-subdir global_shuffle_debug1000
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      debug: 1000
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      debug: 1000
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 30

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 30
