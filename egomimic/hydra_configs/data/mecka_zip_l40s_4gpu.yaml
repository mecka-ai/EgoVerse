# 4×L40S — half cost vs 8×L40S, identical global batch (256).
# Each GPU runs batch_size=64 (vs 32 on 8×L40S).
#
# Launch:
#   python egomimic/modal/trainModal.py \
#     data=mecka_zip_l40s_4gpu trainer=ddp_modal logger=wandb model=<model> \
#     name=<run> description=<desc> \
#     +modal_gpu=L40S:4 +modal_cpu=32 +modal_memory_gb=120 \
#     +modal_volume=mecka_data_zip +modal_ephemeral_disk_gb=600 \
#     norm_stats.precomputed_norm_path=precomputed_norm_stats/mecka_all_zarr \
#     init_submodules=false
#
# Disk budget (600 GB ephemeral):
#   train pool ............ 280 GB
#   valid pool .............. 80 GB
#   probe + torch tmp ....... ~10 GB
#   headroom ............... 230 GB
#
# Train pool sizing math:
#   900 eps/epoch × 1.5 epoch lookahead = 1350 eps held simultaneously
#   At 200 MB worst-case per episode: 270 GB
#   Capacity 280 GB → ~3% headroom above worst case before filler back-pressures.

_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    episodes_per_epoch: 900
    epoch_frames: ${multiply:${trainer.limit_train_batches},${data.train_dataloader_params.mecka_bimanual.batch_size}}
    cache_dir: /cache/zarr_cache
    # Sized to consume the 1 TB ephemeral disk: 880 GB train pool + 80 GB
    # valid pool + ~50 GB headroom for probe / torch tmp / OS = 1010 GB
    # on a 1024 GB disk. Launch with +modal_ephemeral_disk_gb=1024.
    pool_size_gb: 880
    # Lookahead set high enough that the disk gate (capacity_target_ratio
    # * pool_size_gb ≈ 810 GB) binds first, NOT the lookahead cap. At
    # ~150 MB/ep the disk fits ~5400 eps; lookahead must exceed that for
    # the filler to push to disk capacity. 15 × 900 = 13500 → far more
    # than disk holds, so the filler always wants more, and only stops
    # when the disk-gate trips at 810 GB. Net effect: the pool stays
    # maxed-out at all times instead of plateauing at ~74% of capacity.
    lookahead_epochs: 15.0
    n_copy_threads: 32

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      debug: null
      min_frames: null
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 400
    cache_dir: /cache/zarr_cache_valid
    pool_size_gb: 80
    lookahead_epochs: 1.0
    n_copy_threads: 8

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    # Persistent workers live across epochs. The dataset's __getitem__
    # stats <cache_dir>/current_epoch_train.txt and deterministically
    # rebuilds its local index_map (plan+seed are forked in). Eliminates
    # the per-epoch worker respawn cost (was ~325s/epoch).
    persistent_workers: true
    prefetch_factor: 2
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 2
    persistent_workers: false
    prefetch_factor: 1
    shuffle: false
