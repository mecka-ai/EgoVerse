_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.tar_shard_dataset.TarShardMultiDataset
    shard_dir: /mnt/zarr-wds
    # debug: 1000  # uncomment to train on first ~1000 episodes only
    mode: train
    cache_dir: /tmp/shard_cache
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian
    # Plain config block (no _target_) that trainHydra.py uses to build the norm_stats
    # dataset via resolver.key_map. norm_mode=True is injected at runtime. Not instantiated.
    resolver:
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.tar_shard_dataset.TarShardMultiDataset
    shard_dir: /mnt/zarr-wds
    mode: valid
    cache_dir: /tmp/shard_cache
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian
    resolver:
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian

train_dataloader_params:
  mecka_bimanual:
    batch_size: 512
    num_workers: 30
    persistent_workers: true
    prefetch_factor: 1
    # shuffle must be False — TarShardMultiDataset shuffles shards/episodes/frames internally
    shuffle: false

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 512
    num_workers: 2
    persistent_workers: true
    prefetch_factor: 1
