_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.TarShardMultiDataset
    shard_dir: /mnt/zarr-wds
    # debug: 1000  # uncomment to use first ~1000 episodes only
    mode: train
    cache_dir: /cache/shard_cache
    bounds_check: false
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian
    resolver:
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.TarShardMultiDataset
    shard_dir: /mnt/zarr-wds
    mode: valid
    cache_dir: /cache/shard_cache
    bounds_check: false
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian
    resolver:
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian

train_dataloader_params:
  mecka_bimanual:
    batch_size: 768
    num_workers: 30
    persistent_workers: true
    prefetch_factor: 1
    shuffle: false  # TarShardMultiDataset shuffles frames internally

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 768
    num_workers: 2
    persistent_workers: true
    prefetch_factor: 1
    shuffle: false
