_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.tar_shard_dataset.TarShardIterableDataset
    shard_dir: /mnt/zarr-wds
    mode: train
    cache_dir: /tmp/shard_cache
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.tar_shard_dataset.TarShardIterableDataset
    shard_dir: /mnt/zarr-wds
    mode: valid
    cache_dir: /tmp/shard_cache
    key_map:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
      mode: cartesian
    transform_list:
      _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
      mode: cartesian

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
    # shuffle must be False — TarShardIterableDataset shuffles internally
    shuffle: false

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 2
    persistent_workers: true
    prefetch_factor: 1
