_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# CURATION COMPARISON — curated arm, WITH train visualization.
# Identical train/valid to mecka_cmp_curated.yaml (219 train / shared 54 val),
# plus a train_viz_datasets block: 14 train episodes (one per task, all drawn
# from curated_train so they are in BOTH arms' training sets) rendered as videos
# at every validation cycle via the train_viz_evaluator (dataloader_idx=1).
# Pair with: evaluator@train_viz_evaluator=train_viz_hpt

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_cmp_curated_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_cmp_val.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_cmp_viz.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 12

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 12

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
