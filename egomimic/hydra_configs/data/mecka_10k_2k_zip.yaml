_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# pi variant of mecka_10k_2k.yaml — smaller sibling of mecka_50k_20k_zip.yaml,
# for smoke/dev runs of the pi pipeline on optimal's NVMe prefetch path.
#
# Episode-pool selection (mirrors mecka_10k_2k.yaml):
#   ZipEpisodeResolver takes the first `debug` episodes, then split_catalog
#   (seed=42) partitions by valid_ratio:
#     n_valid = int(12000 * 0.16668) = 2000  ->  train = 10000
#   (valid_ratio nudged just above 1/6 so int() lands on 2000, not 1999.)
#
# See mecka_50k_20k_zip.yaml for the windowed-epoch / prefetch-pool notes and the
# /mnt/zarr-zip volume requirement (here: >= 12000 mecka_bimanual episodes).

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      debug: 12000
      valid_ratio: 0.16668
      seed: 42
      pause_removal_epsilon: 0.005
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    episodes_per_epoch: 400
    epoch_frames: ${multiply:${trainer.limit_train_batches},${data.train_dataloader_params.mecka_bimanual.batch_size}}
    cache_dir: /cache/zarr_cache
    pool_size_gb: 150
    lookahead_epochs: 1.5
    n_copy_threads: 16

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      debug: 12000
      valid_ratio: 0.16668
      seed: 42
      pause_removal_epsilon: 0.005
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 100
    cache_dir: /cache/zarr_cache_valid
    pool_size_gb: 30
    lookahead_epochs: 1.0
    n_copy_threads: 4

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 24
    persistent_workers: false
    prefetch_factor: 2
    pin_memory: true
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 2
    persistent_workers: false
    prefetch_factor: 1
    pin_memory: true
    shuffle: false
