_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# DEMINF-14 VAE+SigLIP — TOP-60% arm — zarr volume (ModalEpisodeResolver on /mnt/zarr-data).
# Scores from deminf14_vae_siglip/deminf_curation_2026-07-11_14-21-55.
#
# SHARED ACROSS ALL THREE ARMS (same as the d64 comparison):
#   valid     → mecka_d64_val.json (14, one per task)
#   train_viz → mecka_14task_train_viz.json
#
# ARM-SPECIFIC:
#   train = 234 (deminf14_vae_siglip_top60_train.json — the 237-ep top-60% list
#   minus the 3 val episodes the curation scored into it; val ∩ train = ∅)

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/deminf14_vae_siglip_top60_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_d64_val.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_14task_train_viz.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
