# DemInf curation data config for the ELMO ground-truth-annotated ARIA episodes
# (aria subset of egomimic/modal/elmo_data_gt.json → elmo_data_v2 Modal volume;
# Mecka-schema zarrs converted from Aria MANO recordings; timestamp episode ids).
# The json's 144 EVA robot episodes are excluded — different embodiment/action space.
# Ingested via: INGEST_VOLUME=elmo_data_v2 modal run egomimic/modal/ingest_zarr.py -- <ids>
# Launch curation with MODAL_ZARR_VOLUME=elmo_data_v2 so /mnt/zarr-data mounts this volume.

defaults:
  - _self_

train_datasets:
