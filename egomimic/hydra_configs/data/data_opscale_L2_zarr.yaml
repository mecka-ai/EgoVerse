_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Operator-diversity scaling — level L2 — dishwashing only, fixed 500K-frame
# budget. Same Mecka cartesian + pad_gripper recipe as
# data_dishwashing_48h_oph_zarr.yaml (the 300M HPT dw48 setup); only the splits
# and the second val leg differ.
#
#   train     -> data_diversity/opscale_L2_train.json  (round-robin over the
#                level's top-frame operators, budget 500,000 frames)
#   valid     -> data_diversity/opscale_val_indom8.json  (dataloader_idx=0,
#                Valid/* — 8 eps, one per L1 operator, fixed across levels)
#   train_viz -> data_diversity/dishwashing_val_ophold5.json (dataloader_idx=1,
#                Valid_oph/* via evaluator@train_viz_evaluator=train_viz_hpt_oph
#                + +second_val_prefix=Valid_oph — fully held-out operator)

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
        pad_gripper: true
      eps_to_use: egomimic/hydra_configs/data/extra/data_diversity/opscale_L2_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
        pad_gripper: true
      eps_to_use: egomimic/hydra_configs/data/extra/data_diversity/opscale_val_indom8.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
        pad_gripper: true
      eps_to_use: egomimic/hydra_configs/data/extra/data_diversity/dishwashing_val_ophold5.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true
