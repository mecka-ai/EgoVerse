_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# CURATION COMPARISON — non-curated (all) arm.
# Trains on ALL 14-task episodes (curated + bottom-30% lower-informativeness)
# MINUS the shared validation set. Validates on the SHARED validation set
# (mecka_cmp_val.json) — IDENTICAL to the curated arm (mecka_cmp_curated.yaml)
# so the two runs are directly comparable.
#
# Split derivation (see split_dataset_names, seed=42, valid_ratio=0.2):
#   V = same 54-episode validation set as the curated arm (held out of BOTH)
#   train = 383 - V = 329 episodes (= curated_train 219 + 110 extra lower-MI eps)
# mode: total bypasses the resolver's internal random split — the episode lists
# below are used verbatim, so validation parity is guaranteed by construction.

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_cmp_all_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_cmp_val.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 12

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 12
