# MECKA_RANDOM_100H — random 100h-train sample of mecka_data_v2 (pi0.5 variant).
#
# A random ~125h pool of mecka_bimanual episodes (all tasks) present on the
# mecka_data_v2 volume (allowlist extra/mecka_random_125h.json, 5013 eps), fed to
# the DEFAULT MultiDataset split (valid_ratio 0.2, seed 42, by episode):
#   TRAIN 4011 eps ≈ 100.1h   |   VALID 1002 eps ≈ 24.9h
# ModalEpisodeResolver reads /mnt/zarr-data directly (no zip/tar staging); the
# same allowlist + mode train/valid is what produces the disjoint default split.
#
# Allowlist regenerated by /tmp/gen_random_100h.py (SQL ∩ volume, seed-7 random
# selection to a 125h budget at 30 fps). NOTE: keymap requests annotations
# (pi0.5 language conditioning) — episodes without annotations would fall back to
# default_prompt; set annotations: false below for a non-language run.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

use_tokenizer: true
model_name: "google/paligemma-3b-mix-224"
sampling_mode: random
annotation_key: annotations
default_prompt: ""

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_random_125h.json
    mode: train

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_random_125h.json
    mode: valid

# Small viz set (8 episodes from the pool) for evaluator@train_viz_evaluator=train_viz_pi
# (dataloader_idx=1). Omit the train_viz evaluator at launch if you don't want it.
train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
        annotations: true
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_random_125h.json
      debug: 8
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64        # per-device; 4×H200 → global batch 256
    num_workers: 32
    persistent_workers: true
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    shuffle: false

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
    shuffle: false
