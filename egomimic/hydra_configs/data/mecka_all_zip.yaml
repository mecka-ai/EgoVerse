_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      debug: 1000
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    episodes_per_epoch: 400
    epoch_frames: ${multiply:${trainer.limit_train_batches},${data.train_dataloader_params.mecka_bimanual.batch_size}}
    cache_dir: /cache/zarr_cache
    pool_size_gb: 150
    lookahead_epochs: 1.5
    n_copy_threads: 16

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      debug: 1000
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    episodes_per_epoch: 100
    cache_dir: /cache/zarr_cache_valid
    pool_size_gb: 30
    lookahead_epochs: 1.0
    n_copy_threads: 4

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.prefetch_dataset.PrefetchedMapDataset
    resolver:
      _target_: egomimic.rldb.zarr.prefetch_dataset.ZipEpisodeResolver
      zip_dir: /mnt/zarr-zip
      debug: 1000
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    cache_dir: /cache/zarr_cache_valid
    n_prefetch_epochs: 1
    n_prefetch_workers: 1
    n_copy_threads: 4

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 24
    # persistent_workers=False: workers are re-spawned each epoch so they
    # inherit the fresh index_map loaded by PrefetchEpochCallback.
    persistent_workers: false
    prefetch_factor: 2
    shuffle: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 2
    persistent_workers: false
    prefetch_factor: 1
    shuffle: false
