_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# 10k train + 2k eval mecka_bimanual episodes, non-overlapping.
#
# Smaller sibling of mecka_50k_20k.yaml. Both resolvers select the same 12k
# episodes from the SQL pool via debug=12000 with a deterministic hash-sorted
# truncation, then MultiDataset.split_dataset_names (seed=42) partitions them:
#   n_valid = int(12000 * 0.16668) = 2000  →  train = 10000
# (valid_ratio is nudged just above 1/6 so int() lands on 2000, not 1999.)

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      pause_removal_epsilon: 0.005
      debug: 12000
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: train
    valid_ratio: 0.16668

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      pause_removal_epsilon: 0.005
      debug: 12000
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
    mode: valid
    valid_ratio: 0.16668

train_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 30

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 32
    num_workers: 30
