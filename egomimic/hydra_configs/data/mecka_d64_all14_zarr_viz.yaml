_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# DEMINF-64 — ALL-14 arm — zarr volume (ModalEpisodeResolver on /mnt/zarr-data).
# Reads .zarr dirs directly from mecka_data_v2 (no zip prestaging).
#
# SHARED ACROSS ALL THREE ARMS (all14 / top60 / rand60):
#   valid     → mecka_d64_val.json          (14 eps, 1/task, held out of every train set)
#   train_viz → mecka_14task_train_viz.json (14 eps, 1/task, in-domain for every arm)
#
# ARM-SPECIFIC:
#   train = 369 (mecka_d64_all14_train.json)
#
# Invariants (verified against 64-dim DemInf scores):
#   val ∩ train = ∅ for all arms; train_viz ∩ val = ∅;
#   train_viz ⊆ train for all arms (same viz clips across runs).
#
# Val + train viz: dataloader_idx 0 = eval_hpt, 1 = train_viz_hpt
# (defaults in train_zarr_cartesian.yaml). Use limit_val_batches=1.0.

train_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_d64_all14_train.json
    mode: total

valid_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_d64_val.json
    mode: total

train_viz_datasets:
  mecka_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.ModalEpisodeResolver
      folder_path: /mnt/zarr-data
      key_map:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_keymap
        mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Mecka.get_transform_list
        mode: cartesian
      eps_to_use: egomimic/hydra_configs/data/extra/mecka_14task_train_viz.json
    mode: total

train_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true

valid_dataloader_params:
  mecka_bimanual:
    batch_size: 64
    num_workers: 12
    persistent_workers: true

train_viz_dataloader_params:
  mecka_bimanual:
    batch_size: 8
    num_workers: 4
    persistent_workers: true
