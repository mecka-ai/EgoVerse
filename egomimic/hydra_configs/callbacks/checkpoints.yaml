defaults:
  - defaults
  - _self_

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "step_{step}"
  save_last: true
  save_top_k: -1
  # Step-based so checkpoint cadence is independent of epoch size
  # (a full epoch is thousands of batches when limit_train_batches=null).
  every_n_train_steps: 5000