wandb_profiler:
  _target_: egomimic.utils.timing_callback.WandbProfilerLogger
  log_every_n_steps: 100

# GPU/data: log only when the train loop blocks waiting for the next collated batch.
dataloader_stall:
  _target_: egomimic.utils.timing_callback.DataLoaderStallLogger
  stall_threshold_s: 0.5
  log_ready_after_stall: true