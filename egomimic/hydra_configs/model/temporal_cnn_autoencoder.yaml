# Train a small temporal-CNN autoencoder on per-annotation-span action trajectories.
# Pair with the span-action data config, e.g.:
#
#   python egomimic/trainHydra.py \
#       model=temporal_cnn_autoencoder \
#       data=span_action_zarr \
#       evaluator=null \
#       name=tcn_ae description=mecka_bimanual
#
# Keep `sample_horizon` in sync with the span resample length (ActionNorms.resample_len
# in the data config) and `action_dim` in sync with the embodiment's action dim.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

robomimic_model:
  _target_: egomimic.algo.temporal_cnn_autoencoder.TemporalCNNAutoencoderTrainer
  data_schematic: _${data.dataset.data_schematic}

  domains: ["mecka_bimanual"]
  ac_keys:
    mecka_bimanual: "actions_cartesian"

  autoencoder:
    _target_: egomimic.algo.temporal_cnn_autoencoder.TemporalCNNAutoencoder
    action_dim: 12          # bimanual cartesian action dim
    sample_horizon: 100     # span resample length L (match data ActionNorms.resample_len)
    latent_dim: 128         # bottleneck / per-span embedding dim
    channels: [32, 64, 128]
    kernel_size: 5

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.95]

scheduler: null
