# WAM (World-Action Model) — dreamzero CausalWanModel on the Wan2.2 TI2V-5B
# backbone, mecka_bimanual embodiment. ONE joint DiT forward over
# [video latent | action | state] predicts video + action velocities (rectified
# flow). The pretrained video DiT is loaded + frozen (LoRA-adapted); the
# state/action/decoder register modules train. Validation samples action + a
# future frame; WAMEvalVideo renders both. Pair with data=mecka_wam.
#
# 5B geometry (Wan2.2 VAE38 = 16x spatial, 4x temporal; DiT patch (1,2,2)):
#   frame 160x320 -> latent 10x20 -> DiT patch -> 5x10 = 50 tokens/frame (frame_seqlen)
#   cam clip 17 frames -> 5 latent frames (1 cond + 4 predicted)
#   action_horizon=16  (num_action_per_block=4 x 4 blocks)
#   state_horizon=4    (num_state_per_block=1 x 4 blocks)
#   => num_image_blocks == num_action_blocks == num_state_blocks == 4
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.wam.WAM

  domains: ["mecka_bimanual"]
  ac_keys:
    mecka_bimanual: "actions_cartesian"

  action_dim: 12
  action_horizon: 16
  state_dim: 12
  target_h: 160            # Wan2.2 5B input resolution (non-square)
  target_w: 320
  # Latent frames per DiT forward: cam clip 17 -> 5 latents (1 cond + 4
  # predicted). Also the rolling-window size F_total in sample_rolling
  # (n_hist = num_video_frames - num_frame_per_block).
  num_video_frames: 5
  world_loss_weight: 1.0
  num_inference_steps: 16

  # --- CausalWanModel DiT (Wan2.2 TI2V-5B, joint video+action) ------------
  dit:
    _target_: egomimic.models.wam_nets.build_wam_dit
    arch: wan22_5b
    checkpoint_path: /mnt/wan-ckpts/Wan2.2-TI2V-5B/diffusion_pytorch_model.safetensors.index.json
    action_dim: 12
    max_state_dim: 12
    num_action_per_block: 4     # 4 actions per predicted-frame block (x4 blocks = 16)
    num_state_per_block: 1      # 1 state obs per predicted-frame block (x4 = state_horizon 4)
    frame_seqlen: 50            # (160/16/2) * (320/16/2) = 5*10
    freeze_video: true          # train state/action/decoder; freeze pretrained blocks
    lora: true                  # dreamzero-style LoRA adapters on the DiT blocks

  # --- Wan2.2 VAE38 (frozen, z_dim=48): frame <-> latent ------------------
  vae:
    _target_: egomimic.models.wam_nets.build_wan_vae
    checkpoint_path: /mnt/wan-ckpts/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    z_dim: 48

# Published Wan2.2-TI2V-5B fine-tune recipe: AdamW lr 1e-5..2e-5, betas
# (0.9, 0.999), eps 1e-8, weight_decay 1e-2, linear warmup then cosine annealed
# to 10% of peak. 2e-5 is the value paired with this full recipe at a batch
# comparable to ours (effective 4 = 2 per-GPU x 2 accumulate).
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2e-5
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 1e-2

# Warmup + monotone cosine decay to 10% of peak. Replaces CosineAnnealingLR,
# which under scheduler_interval=step ran a 1400-step half-cycle and then
# annealed the LR back UP — a repeating triangle, never a decay.
# Horizon: 2000 epochs x 100 batches / accumulate_grad_batches 2 = 100k steps.
scheduler:
  _target_: transformers.optimization.get_cosine_with_min_lr_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 500
  num_training_steps: 100000
  num_cycles: 0.5
  min_lr: 2e-6

scheduler_interval: step
