defaults:
  - hpt_cotrain_enc_dec_base

robomimic_model:
  domains: ["eva_bimanual", "mecka_bimanual"]

  ac_keys:
    eva_bimanual: "actions_cartesian"
    mecka_bimanual: "actions_cartesian"
  shared_ac_key: "actions_cartesian"

  camera_transforms:
    mecka_bimanual:
      _target_: egomimic.utils.egomimicUtils.CameraTransforms
      intrinsics_key: "mecka"
      extrinsics_key: "x5Dec13_2"

  6dof: true
  diffusion: true

  trunk:
    embed_dim: 840
    num_blocks: 24
    num_heads: 10
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 840
      output_dim: 840
      widths: [840]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 18
          crossattn_heads: 10
          crossattn_dim_head: 140
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 840

  stem_specs:
    mecka_bimanual:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840
    eva_bimanual:
      state_joint_positions:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 14
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840
      right_wrist_img:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 840
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840
      left_wrist_img:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 840
        output_dim: 840
        widths: [840]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840

  head_specs:
    mecka_bimanual: null
    eva_bimanual: null
    shared:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      padding: "zero"
      time_dist: "beta"
      infer_ac_dims:
        eva_bimanual: 14
        mecka_bimanual: 14
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 840
        hidden_dim: 320
        act_dim: 14
        act_seq: 100
        n_heads: 5
        dropout: 0.1
        mlp_layers: 5
        mlp_ratio: 5

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 840
      num_of_copy: 1
    right_wrist_img:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 840
      num_of_copy: 1
    left_wrist_img:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 840
      num_of_copy: 1

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 9.0e-05
  weight_decay: 0.0001

scheduler:
  _target_: transformers.optimization.get_wsd_schedule
  _partial_: true
  num_warmup_steps: 25000
  num_decay_steps: 40000
  num_training_steps: 200000
  min_lr_ratio: 0.1

scheduler_interval: step
