# Arc Tokenizer — first-class algo for progress-based action tokens (49-dim).
# Sequence actions by PROGRESS instead of time: 30 cm chunks, 100 arc waypoints,
# STILL branch for pauses, packed per-waypoint velocity. Layout:
#   [L palm 6D (0:9) | L tips (9:24) | R palm (24:33) | R tips (33:48) | speed (48:49)]
# Stability baked into the ArcTok network defaults: pre-quant LayerNorm (FSQ
# saturation collapse impossible) and no encoder positional embedding (waypoints
# are indexed by progress, not time). Watch Train/*_perplexity: pp -> 0 = collapse.
#
#   python egomimic/modal/trainModal.py \
#       model=arc_tokenizer \
#       data=mecka_preanno199_zarr_wf6d_ft_arctok_or_your_dataset \
#       visualization=fingertips_wrist_6d_arctok \
#       evaluator=eval_arc_tokenizer_video \
#       "evaluator@train_viz_evaluator=train_viz_arc_tokenizer" \
#       trainer=ddp_modal logger=wandb \
#       name=arctok_run description=<desc> \
#       data.train_dataloader_params.mecka_bimanual.batch_size=128 \
#       trainer.check_val_every_n_epoch=30 trainer.limit_train_batches=100 \
#       trainer.limit_val_batches=100 callbacks.model_checkpoint.every_n_epochs=30 \
#       init_submodules=quest reject_outliers=false \
#       +modal_gpu=A100 +modal_cpu=12 +modal_memory_gb=80 +modal_volume=mecka_data_v2 \
#       launch_params.gpus_per_node=1
#
# Data config for preann199: mecka_preanno199_zarr_quest_wf6d_ft_arctok
# (cartesian_wristframe_6d_fingertips_arctok transform). No precomputed norm
# stats — the 49-dim arc distribution computes online.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

robomimic_model:
  _target_: egomimic.algo.arc_tokenizer.ArcTokenizerTrainer
  data_schematic: _${data.dataset.data_schematic}

  domains: ["mecka_bimanual"]
  ac_keys:
    mecka_bimanual: "actions_cartesian"

  # The deterministic Arc Tokenizer module (parameter-free nn.Module) — the
  # canonical tokenization spec. Keep these values in sync with the data
  # transform (ApplyArcTokenizer in the arctok mode builder), which executes the
  # same module per-sample in dataloader workers.
  arc_tokenizer:
    _target_: egomimic.models.arc_tokenizer.ArcTokenizer
    delta_s: 0.30        # metres of combined wrist travel per token chunk
    num_waypoints: 100
    eps: 0.03            # < 3 cm available -> STILL token
    n_max: 450           # > 450 frames to cover delta_s -> STILL token
    velocity_mode: "per_waypoint"

  # loss_block_weights defaults to the arctok 49-dim layout (palm 1.0, tips 2.0,
  # speed 0.5) inside the trainer; override here only to change the weighting.

  tokenizer:
    _target_: egomimic.algo.arc_tokenizer.ArcTok
    action_dim: 49
    # use_positional_emb: false / normalize_pre_quant: true are ArcTok defaults
    encoder_dim: 384
    decoder_dim: 384
    skill_block_size: 100   # arc waypoints per token chunk
    downsample_factor: 4    # 100 waypoints -> 25 latent tokens (~1.2 cm of path each)
    attn_pdrop: 0.1
    use_causal_encoder: true
    use_causal_decoder: true
    encoder_heads: 6
    encoder_layers: 4
    decoder_heads: 6
    decoder_layers: 6
    vq_type: "fsq"
    fsq_level: [8, 8, 6, 5]  # 1920 codes
    codebook_dim: 512
    codebook_size: 1024

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.95]

scheduler: null
