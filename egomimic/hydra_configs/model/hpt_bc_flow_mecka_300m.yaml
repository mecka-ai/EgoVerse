# ~300M-param HPT (flow-matching head) for Mecka bimanual.
# Scaled from hpt_bc_flow_mecka: trunk embed_dim 256→840, blocks 16→24,
# heads 8→10; stems/encoder/head widths widened to match. Optimizer
# lr 5e-5 + CosineAnnealingLR (T_max 100k). Pair with a zip data config:
#
#   python egomimic/modal/trainModal.py \
#     model=hpt_bc_flow_mecka_300m data=mecka_zip_h100_4gpu \
#     trainer=ddp_modal logger=wandb name=<run> description=<desc> \
#     +modal_gpu=H100:4 +modal_cpu=96 +modal_memory_gb=200 \
#     +modal_volume=mecka_data_zip +modal_ephemeral_disk_gb=2000 \
#     norm_stats.precomputed_norm_path=precomputed_norm_stats/mecka_all_zarr \
#     init_submodules=false
_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  data_schematic: _${data.dataset.data_schematic}
  camera_transforms:
    mecka_bimanual:
      _target_: egomimic.utils.egomimicUtils.CameraTransforms
      intrinsics_key: "mecka" # change to base_half if using half res
      extrinsics_key: "mecka"

  diffusion: true
  6dof: true

  ac_keys:
    mecka_bimanual: "actions_cartesian"

  trunk:
    embed_dim: 840 # changed from 256  #84
    num_blocks: 24 # changed from 16
    num_heads: 10 # changed from 8
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: "" # TODO
  reverse_kl_samples: 8

  domains: ["mecka_bimanual"]
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 840 # changed from 512
      output_dim: 840 #changed
      widths: [840] # changed from 840
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 18
          crossattn_heads: 10
          crossattn_dim_head: 140 # changed from 256
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 840 # changed from 840

  stem_specs:
    mecka_bimanual:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 12
        output_dim: 840 # changed from 840
        widths: [840] # changed from 840
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 18
            crossattn_heads: 10
            crossattn_dim_head: 140 # changed from 256 changed from 1024
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 840 # changed from 840 changed from 1536

  head_specs:
    mecka_bimanual:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      time_dist: "beta"
      infer_ac_dims:
        mecka_bimanual: 12
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 840 # changed from 256 changed from 1536
        hidden_dim: 320 #changed from 128
        act_dim: 12
        act_seq: 100
        n_heads: 5 # changed from 4 changed from 16
        dropout: 0.1
        mlp_layers: 5 # edit num of mlp layers
        mlp_ratio: 5

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 840 # changed from 512 changed from 1536


  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-5
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 100000
  eta_min: 1e-5
