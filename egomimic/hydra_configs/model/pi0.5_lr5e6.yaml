defaults:
  - pi0.5_bc_mecka
  - _self_

# LR-sweep point 2/3 for the ironing_clothes 30h dataset
# (data=mecka_zip_h200_ironing_30h). Loads the pretrained pi0.5 base
# (pi0.5_bc_mecka → pi05_base_pytorch). On Modal pass
# model.robomimic_model.config.pytorch_weight_path=pi_checkpoints/pi05_base_pytorch
# at launch — the YAML default is a SLURM-only absolute path, and trainModal only
# rewrites relative CLI overrides to the outputs volume. Swap the defaults base
# to pi0.5_bc_mecka_scratch to train from scratch.
#
# Cosine-schedule T_max (num_training_steps) = ONE pass over 30h of data:
#   30h × 3600 s/h × 30 fps = 3,240,000 samples ÷ global batch 256 = 12,656 steps.
#   (global batch 256 = 4×H200 DDP × 64 per-device; the scheduler steps once per
#    global batch, so the divisor is 256, not the per-device 64.)
# Warmup set to 1000 steps (~8% of T_max). num_cycles 0.5 → decay to 0 at T_max.
optimizer:
  lr: 5e-6

scheduler:
  num_warmup_steps: 1000
  num_training_steps: 50000
