_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.pi.PI
  data_schematic: _${data.dataset.data_schematic}
  config:
    pytorch_training_precision: bfloat16
    pytorch_weight_path: /storage/home/hcoda1/4/paphiwetsa3/r-dxu345-0/projects/EgoVerse/egomimic/algo/pi_checkpoints/pi05_base_pytorch
    # Optional: init only the PaliGemma VLM backbone from a pretrained HF
    # snapshot (action expert stays random). Leave null to keep the
    # pytorch_weight_path / from-scratch behavior. On Modal, pass a
    # volume-relative path (trainModal rewrites it to the outputs mount), e.g.
    # model.robomimic_model.config.paligemma_weight_path=paligemma_weights/paligemma-3b-pt-224
    paligemma_weight_path: null
    model:
      pi05: true
      action_dim: 32
      action_horizon: 100
      max_token_len: 180

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: 224
        interpolation: 3
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: 224
        interpolation: 3

enable_grad_norm: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3e-5
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.0

scheduler:
  _target_: transformers.get_cosine_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 2000
  num_training_steps: 60000
  # num_cycles omitted (the get_cosine_schedule_with_warmup default is 0.5) so
  # lr configs can override _target_ to a scheduler that takes no num_cycles
  # (e.g. get_linear_schedule_with_warmup) without an unexpected-kwarg error.

scheduler_interval: step