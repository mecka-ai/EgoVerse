# QueST tokenizer for ARC TOKENIZER actions (49-dim): progress-based sampling with
# a still branch + packed velocity features. Shape-first: the 48 spatial dims are
# the arc-resampled path (time removed); dim 48 is the per-waypoint path speed.
# Stability settings baked in (post FSQ-saturation-collapse):
#   - normalize_pre_quant: LayerNorm before FSQ (saturation structurally impossible)
#   - lr 1e-4 (3e-4 triggered encoder scale blowup)
#   - downsample_factor 4 (25 tokens), FSQ [8,8,6,5] = 1920 codes
#   - perplexity logged to W&B by the trainer (watch it: pp -> 0 = collapse)
# Pair with data=mecka_preanno199_zarr_quest_wf6d_ft_arctok + visualization=fingertips_wrist_6d_arctok.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

robomimic_model:
  _target_: egomimic.algo.quest_tokenizer.QuestTokenizerTrainer
  data_schematic: _${data.dataset.data_schematic}

  domains: ["mecka_bimanual"]
  ac_keys:
    mecka_bimanual: "actions_cartesian"

  # 49-dim layout: [L palm 6D (0:9) | L tips (9:24) | R palm (24:33) | R tips (33:48) | speed (48:49)]
  # Shape blocks dominate (this representation exists to retain trajectory shape);
  # speed is a light auxiliary channel.
  loss_block_weights:
    - {name: palm_left, start: 0, end: 9, weight: 1.0}
    - {name: tips_left, start: 9, end: 24, weight: 2.0}
    - {name: palm_right, start: 24, end: 33, weight: 1.0}
    - {name: tips_right, start: 33, end: 48, weight: 2.0}
    - {name: speed, start: 48, end: 49, weight: 0.5}

  skill_vae:
    _target_: egomimic.algo.skill_vae_mecka.SkillVAEMecka
    action_dim: 49
    use_positional_emb: false
    normalize_pre_quant: true  # LayerNorm before FSQ: prevents saturation collapse
    encoder_dim: 384
    decoder_dim: 384
    skill_block_size: 100
    downsample_factor: 4    # 100 waypoints -> 25 latent tokens (~1.2cm of path each)
    attn_pdrop: 0.1
    use_causal_encoder: true
    use_causal_decoder: true
    encoder_heads: 6
    encoder_layers: 4
    decoder_heads: 6
    decoder_layers: 6
    vq_type: "fsq"
    fsq_level: [8, 8, 6, 5]  # 1920 codes
    codebook_dim: 512
    codebook_size: 1024

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.95]

scheduler: null
