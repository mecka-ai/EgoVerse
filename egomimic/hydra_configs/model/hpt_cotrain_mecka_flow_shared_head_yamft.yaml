defaults:
  - hpt_cotrain_mecka_flow_shared_head

# YAM finetune model — fixes a silent proprio drop.
#
# The yam (eva-schema) data is loaded through the EVA *cartesian* keymap, which
# produces the proprioceptive state under keyname `state_ee_pose` (14-d: per-arm
# xyz+ypr+gripper). The base cotrain eva stem is keyed `state_joint_positions`,
# which never matches that data — and HPTModel.stem_process() silently `continue`s
# past any stem modality absent from the batch. Result: the policy trained with NO
# end-effector-pose conditioning (image-only), which biases absolute-pose predictions.
#
# Add a `state_ee_pose` stem so the model actually consumes the EEF pose. The base's
# `state_joint_positions` stem remains but gets no data and is harmlessly skipped.
robomimic_model:
  stem_specs:
    eva_bimanual:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 14
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
