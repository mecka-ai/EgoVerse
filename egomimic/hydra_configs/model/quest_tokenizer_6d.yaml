# QueST SkillVAE tokenizer for 6D-rotation wrist-frame actions (18-dim bimanual).
# Identical to quest_tokenizer.yaml except action_dim=18 (xyz + 6D rotation columns
# per arm × 2). Pair with a data config whose transform emits cartesian_wristframe_6d
# (18-dim), e.g. mecka_preanno199_zarr_quest_wf6d.
#
#   python egomimic/modal/trainModal.py \
#       model=quest_tokenizer_6d \
#       data=mecka_preanno199_zarr_quest_wf6d \
#       evaluator=eval_span_reconstruction \
#       "~evaluator@train_viz_evaluator" \
#       name=quest_tok_preanno199_wf6d description=preanno199_wristframe_6d \
#       trainer=ddp_modal \
#       trainer.check_val_every_n_epoch=30 trainer.limit_train_batches=100 \
#       trainer.limit_val_batches=100 callbacks.model_checkpoint.every_n_epochs=30 \
#       +modal_gpu=A100 +modal_cpu=12 +modal_memory_gb=80 +modal_volume=mecka_data_v2 \
#       init_submodules=quest reject_outliers=false launch_params.gpus_per_node=1
#
# No precomputed_norm_path: 6D wrist-frame actions have a distinct distribution,
# so norm stats are computed online (6D is continuous, so per-dim stats are valid).
_target_: egomimic.pl_utils.pl_model.ModelWrapper

robomimic_model:
  _target_: egomimic.algo.quest_tokenizer.QuestTokenizerTrainer
  data_schematic: _${data.dataset.data_schematic}

  domains: ["mecka_bimanual"]
  ac_keys:
    mecka_bimanual: "actions_cartesian"

  skill_vae:
    _target_: quest.algos.quest_modules.skill_vae.SkillVAE
    action_dim: 18          # bimanual cartesian 6D: (xyz + 6D columns) × 2 arms
    encoder_dim: 256
    decoder_dim: 256
    skill_block_size: 100   # action chunk length (must match dataset seq_len)
    downsample_factor: 4    # power-of-2 temporal compression; 100/4 = 25 latent tokens
    attn_pdrop: 0.1
    use_causal_encoder: true
    use_causal_decoder: true
    encoder_heads: 4
    encoder_layers: 2
    decoder_heads: 4
    decoder_layers: 4
    vq_type: "fsq"
    fsq_level: [8, 5, 5, 5]  # codebook size = 8×5×5×5 = 1000 (latent, independent of action_dim)
    codebook_dim: 512         # unused for FSQ; required by constructor
    codebook_size: 1024       # unused when fsq_level is explicit

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.95]

scheduler: null
