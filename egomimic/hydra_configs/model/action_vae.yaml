_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.action_vae.ActionVAETrainer
  data_schematic: _${data.dataset.data_schematic}
  domains: ["mecka_bimanual"]
  ac_keys:
    mecka_bimanual: "actions_cartesian"
  sample_horizon: 100
  sample_dim: 12
  latent_dim: 32
  encoder_hidden: [512, 256]
  decoder_hidden: [256, 512]
  beta: 1.0
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001
scheduler: null
