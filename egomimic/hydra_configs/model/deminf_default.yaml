# DemInf curation model settings (OmegaConf only — not Hydra-instantiated).

latent_dim: 32
device: cuda

# projection for viewer exports: method (tsne | umap | pca) and dims (2 or 3)
projection: tsne
projection_dims: 3

# Token-level span viz (action_embedder.type=quest_tokens) — egomimic/curation/token_viz.py.
# granularity: projection point granularity. span (default) for language-alignment work;
#              token for debugging the tokenizer itself; chunk in between.
# balance:     subsample allocation for cap — span | cluster | none (uniform lets
#              chunk-rich spans dominate the map).
# preproc:     embedding stages before projection (these change what the map shows more
#              than the projection method does).
# cache:       content-keyed chunk/token/projection caches on the volume — a projection
#              tweak (2D→3D, tsne→umap, new granularity) skips the zarr read + re-encode.
# Optional span filter for clustered scoring/viz: path to an episode-set JSON —
# either {"sets": [{"name": ..., "episodes": [{"episode_id": ...}, ...]}, ...]} (e.g.
# data/extra/preanno199_aligned_verb_hand_sets.json) or a plain list of episode ids.
# Only spans from these episodes are clustered/scored/plotted. null = all spans.
span_filter:
  episodes_json: null

token_viz:
  granularity: span   # token | chunk | span
  span_resample: false  # temporal norm: one horizon-length resampled chunk per span
  cap: 60000
  balance: span       # span | cluster | none
  preproc:
    center_by_position: false  # token granularity: subtract per-token-position mean
    l2norm: false
    whiten: false
    pca_dim: 50       # pre-projection PCA; 0 = off
  cache: true
  cache_dir: /root/EgoVerse/logs/deminf_cache
  metrics: true       # write metrics.json (language NMI, kNN acc, locality lift, FSQ usage)

keys:
  action: actions_cartesian
  image: observations.images.front_img_1

norm_min_std: 1.0e-6

# Action embedder for Pass 2 (KSG MI input).
# type=gaussian: Gaussian normalisation + random orthogonal projection (default, no checkpoint needed).
# type=checkpoint: load a trained model (e.g. OAT tokeniser) from checkpoint_path.
#   encode_method: method on the loaded model to call — must accept (T, action_dim) tensor,
#                  return (T, latent_dim) tensor (default: "encode").
action_embedder:
  type: gaussian  # gaussian | checkpoint
  checkpoint_path: null
  encode_method: encode

# Pass 2 state image embedder. Set backbone; dinov3 block is used only when backbone=dinov3,
# wes block only when backbone=wes.
state_image:
  backbone: dinov3  # resnet18 | dinov3 | wes
  dinov3:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
    dtype: float16
  wes:
    checkpoint_path: /root/wes_h_v3.0.pt  # baked into Modal image via modal_setup.py

# Required: path to norm_stats.json (same JSON as training offline_norm_stats).
# Run the offline norm-stats script before curating; raises ValueError if absent.
precomputed_norm_stats:
  path: precomputed_norm_stats/mecka_all_zarr
  embodiment_id: "9"

# Language-conditioned DemInf (optional). When enabled=false, scores I(S; A).
# mode=concat:     I(S, L; A) — concatenate state + language latents for KSG.
# mode=stratified: I(S; A | L) — KSG within each instruction cluster.
# source=qwen3:       embed annotation text live with Qwen3-Embedding-0.6B.
# source=precomputed: read per-frame embeddings from language_key in zarr.
language_conditioning:
  enabled: false
  mode: concat  # concat | stratified | clustered
  source: qwen3  # qwen3 | precomputed
  language_key: annotations
  stratified_min_cluster_size: 10
  # clustered mode: atomic unit is the annotation span. K-means clusters spans by
  # their Qwen3 language embedding, then KSG-scores each cluster independently and
  # ranks spans within it (output: scores_v2/<task>_clustered_scores.json).
  n_clusters: auto        # "auto" (silhouette over 2..n_clusters_max) or an int
  n_clusters_max: 20      # upper bound for auto silhouette search
  clustered_min_spans: 8  # clusters with fewer spans are formed but not scored (logged)
  # Qwen3 instruction that steers clustering toward per-hand verb structure over objects.
  # Set to "" to cluster on the raw annotation text (objects included).
  cluster_instruction: "You are embedding a bimanual manipulation instruction so clips can be clustered PURELY by motion type. The ONLY thing that may influence the vector is the pair (left-hand verb, right-hand verb): the action each hand performs and which hand performs it. Map two instructions to almost identical vectors when both hands perform the same kind of action — treat synonyms as the SAME verb (cut/slice/chop, hold/grip/steady/support, wipe/scrub/rub, pick up/grab/lift, place/put/set down, screw/tighten, twist/turn). Map them to clearly separated vectors whenever either hand's verb differs OR the left/right assignment is swapped. Example: 'hold garlic with left hand, cut garlic with knife in right hand' and 'steady the box with the left hand while slicing tape with a blade in the right hand' must be NEAR-IDENTICAL (left=hold, right=cut). Aggressively erase everything else: objects, tools, materials, colors, counts, locations, surfaces, and all scene detail must have ZERO influence on the vector. Encode only what each hand is doing."
  qwen3:
    model_name: Qwen/Qwen3-Embedding-0.6B
    max_length: 512
    batch_size: 64
    dtype: float16

# t-SNE exports (2-D PNG + 3-D JSON for build_latent_viz.py).
# When language conditioning is on, also emits state_lang, language, state_by_lang.
tsne:
  every_n: 10
  include_state_lang: true
  include_language: true
  include_state_by_lang: true
  state_color_by: auto  # auto | episode | time | language

# Pass 3 (clustered mode): per-cluster span scoring algorithm (modular).
#   ksg      — mean per-frame KSG mutual information I(state;action) over the span.
#   centroid — Euclidean distance from the span's pooled latent to the cluster
#              centroid (smaller = more representative); centroid_space ∈ {action,state,joint}.
cluster_scoring:
  algo: ksg
  centroid_space: action
  # disable=true: cluster + write t-SNE/viewer artifact but skip per-cluster scoring (faster).
  disable: false

# Pass 3: KSG on concatenated episode latents (CPU).
ksg:
  n_threads: 28
  k_range: [3, 7]
  # Approximate subsampled KSG (disabled when null). Enable both, e.g. 100000.
  chunked_threshold: null
  chunked_max_points: null
  batch_size: 10000
