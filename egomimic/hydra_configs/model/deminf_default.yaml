# DemInf curation model settings (OmegaConf only — not Hydra-instantiated).

latent_dim: 32
device: cuda

keys:
  action: actions_cartesian
  image: observations.images.front_img_1

norm_min_std: 1.0e-6

# Action embedder for Pass 2 (KSG MI input).
# type=gaussian: Gaussian normalisation + random orthogonal projection (default, no checkpoint needed).
# type=checkpoint: load a trained model (e.g. OAT tokeniser) from checkpoint_path.
#   encode_method: method on the loaded model to call — must accept (T, action_dim) tensor,
#                  return (T, latent_dim) tensor (default: "encode").
action_embedder:
  type: gaussian  # gaussian | checkpoint
  checkpoint_path: null
  encode_method: encode

# Pass 2 state image embedder. Set backbone; dinov3 block is used only when backbone=dinov3,
# wes block only when backbone=wes.
state_image:
  backbone: dinov3  # resnet18 | dinov3 | wes
  dinov3:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
    dtype: float16
  wes:
    checkpoint_path: /root/wes_h_v3.0.pt  # baked into Modal image via modal_setup.py

# Required: path to norm_stats.json (same JSON as training offline_norm_stats).
# Run the offline norm-stats script before curating; raises ValueError if absent.
precomputed_norm_stats:
  path: precomputed_norm_stats/mecka_all_zarr
  embodiment_id: "9"

# Language-conditioned DemInf (optional). When enabled=false, scores I(S; A).
# mode=concat:     I(S, L; A) — concatenate state + language latents for KSG.
# mode=stratified: I(S; A | L) — KSG within each instruction cluster.
# source=qwen3:       embed annotation text live with Qwen3-Embedding-0.6B.
# source=precomputed: read per-frame embeddings from language_key in zarr.
language_conditioning:
  enabled: false
  mode: concat  # concat | stratified | clustered
  source: qwen3  # qwen3 | precomputed
  language_key: annotations
  stratified_min_cluster_size: 10
  # clustered mode: atomic unit is the annotation span. K-means clusters spans by
  # their Qwen3 language embedding, then KSG-scores each cluster independently and
  # ranks spans within it (output: scores_v2/<task>_clustered_scores.json).
  n_clusters: auto        # "auto" (silhouette over 2..n_clusters_max) or an int
  n_clusters_max: 20      # upper bound for auto silhouette search
  clustered_min_spans: 8  # clusters with fewer spans are formed but not scored (logged)
  qwen3:
    model_name: Qwen/Qwen3-Embedding-0.6B
    max_length: 512
    batch_size: 64
    dtype: float16

# t-SNE exports (2-D PNG + 3-D JSON for build_latent_viz.py).
# When language conditioning is on, also emits state_lang, language, state_by_lang.
tsne:
  every_n: 10
  include_state_lang: true
  include_language: true
  include_state_by_lang: true
  state_color_by: auto  # auto | episode | time | language

# Pass 3: KSG on concatenated episode latents (CPU).
ksg:
  n_threads: 28
  k_range: [3, 7]
  # Approximate subsampled KSG (disabled when null). Enable both, e.g. 100000.
  chunked_threshold: null
  chunked_max_points: null
  batch_size: 10000
