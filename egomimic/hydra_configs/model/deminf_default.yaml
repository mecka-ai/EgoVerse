# DemInf curation model config — default settings.
#
# Launch a curation run:
#   python egomimic/trainHydra.py --config-name=curate \
#       name=my_run description=test data=mecka_all_zarr model=deminf_default
#
# Override individual knobs inline, e.g.:
#   model.filter_ratio=0.2 model.scorer.k_range=[5,9]

_target_: egomimic.algo.deminf.DemInfAlgo

# ── Cross-embodiment ────────────────────────────────────────────────────────
# "independent": KSG runs separately per embodiment group (recommended for
#   heterogeneous datasets — avoids mixing 42-D hand keypoints with 14-D
#   joint positions in the same NN search).
# "shared": single KSG pass over all embodiments jointly (only sensible when
#   all embodiments share the same retargeted action space).
cross_embodiment_mode: independent

# ── Selection ───────────────────────────────────────────────────────────────
# Fraction of scored episodes to discard (lowest MI scores removed first).
filter_ratio: 0.3

device: cpu

# ── State embedder ───────────────────────────────────────────────────────────
# mode: "proprioceptive" (default) or "image".
# In proprioceptive mode, raw obs arrays are Gaussian-normalised then
# projected to latent_dim via a random orthogonal matrix.
# In image mode, a frozen ResNet-18 + fixed random linear head is used.
state_embedder:
  _target_: egomimic.curation.embedders.StateEmbedder
  mode: proprioceptive
  latent_dim: 32
  cross_embodiment_mode: ${..cross_embodiment_mode}
  device: ${..device}

# ── Action embedder ──────────────────────────────────────────────────────────
# Embeds per-timestep actions (T, D) OR pre-stored action chunks
# (T, chunk_size, D) from the zarr key "actions_cartesian".
# Both formats are flattened to (T, chunk_size*D) before normalisation
# and random-orthogonal projection to latent_dim.
action_embedder:
  _target_: egomimic.curation.embedders.ActionEmbedder
  latent_dim: 32
  cross_embodiment_mode: ${..cross_embodiment_mode}

# ── KSG scorer ───────────────────────────────────────────────────────────────
# k_range: [k_min, k_max] — KSG is run for each k in this inclusive range
# and averaged for robustness.  Wider ranges increase compute but reduce
# variance in the MI estimate.
scorer:
  k_range: [3, 7]

# ── Preprocessing filters ────────────────────────────────────────────────────
# Applied in order before embedding.  Each entry is Hydra-instantiated.
#
# PauseFilter   — collapses pause frames (||Δa|| < epsilon) to a single
#                 representative frame; keeps context at pause boundaries.
# ActionClipFilter — per-episode Gaussian normalisation + clipping, removing
#                 teleop glitches that would dominate the embedding space.
# MinLengthFilter  — discards episodes shorter than min_length timesteps after
#                 the above two filters.
preprocessing:
  - _target_: egomimic.curation.filters.PauseFilter
    epsilon: 0.01
    embodiment_overrides:
      mecka_bimanual: 0.005
  - _target_: egomimic.curation.filters.ActionClipFilter
    clip: 1.0
  - _target_: egomimic.curation.filters.MinLengthFilter
    min_length: 20
