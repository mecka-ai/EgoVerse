# DemInf curation on Modal — episode bulk read + embed per task worker.
#
#   python egomimic/modal/curateModal.py name=<run> description=<desc>
#
# Pipeline (per task):
#   Pass 2 — episodes sharded into chunks of ≤ max_episodes_per_shard, each
#            shard embedded in a separate GPU container (parallel zarr load,
#            batched JPEG decode, ResNet/DINOv3 state embed, action embed)
#   Pass 3 — KSG MI on all shard latents combined (CPU orchestrator)
#
# model.precomputed_norm_stats.path is REQUIRED (raise ValueError if absent).
# Run the offline norm-stats script once and set it before curating.
#
# Global RNG seed (embedders, KSG, PyTorch): override with seed=<int>
#
# Per-task Modal worker compute (orchestrator is fixed lightweight CPU):
#   +modal_gpu=L40S:1 +modal_cpu=32 +modal_memory_gb=128
#
# Common Hydra overrides:
#   model.state_image.backbone=dinov3
#   data.curation_loader.mecka_bimanual.episode_workers=1
#   data.curation_loader.mecka_bimanual.frame_queue_maxsize=16
#   data.curation_loader.mecka_bimanual.global_frame_batch_size=256
#   model.ksg.chunked_threshold=100000 model.ksg.chunked_max_points=100000
#   max_episodes_per_shard=200
#   model.language_conditioning.enabled=true
#   model.language_conditioning.mode=concat      # I(S,L;A)
#   model.language_conditioning.mode=stratified  # I(S;A|L)
#   model.tsne.include_state_lang=false  # disable joint [state|lang] t-SNE panel

defaults:
  - model: deminf_default
  - data: deminf_mecka
  - _self_

name: curate_test
description: deminf_curation
seed: 42

# Max episodes per GPU shard (Pass 2). Tasks with more episodes are split
# into multiple containers; KSG runs on all shards combined (Pass 3).
max_episodes_per_shard: 30

hydra:
  run:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
